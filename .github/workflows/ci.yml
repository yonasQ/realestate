name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: realtor
          POSTGRES_PASSWORD: realtor
          POSTGRES_DB: realtor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U realtor" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://realtor:realtor@localhost:5432/realtor_test
      DATABASE_URL: postgres://realtor:realtor@localhost:5432/realtor_test
      APP_SECRET: ci-only-secret-ci-only-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
        env:
          DATABASE_URL: postgres://unused@127.0.0.1:1/none # build must not need a database
          SITE_URL: https://example.com
      - run: pnpm audit --prod --audit-level high
